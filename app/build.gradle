plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'org.titanv80.app'
    compileSdk 34

    defaultConfig {
        applicationId "org.titanv80.app"
        minSdk 26
        targetSdk 34
        versionCode 80
        versionName "80.0.0"

        ndk {
            abiFilters "arm64-v8a"
        }

        python {
            version "3.11"
            pip {
                install "numpy>=1.24,<2.1"
                install "pandas>=2.0,<2.3"
                install "requests>=2.31,<3"
                install "flask>=3.0,<3.2"
                install "waitress>=3.0,<4"
                install "websocket-client>=1.6,<2"
            }
        }
    }

    buildTypes {
        release { minifyEnabled false }
        debug { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ["META-INF/LICENSE", "META-INF/LICENSE.txt", "META-INF/NOTICE", "META-INF/DEPENDENCIES"]
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.webkit:webkit:1.11.0'
}
