name: Build TAI Android APK (TITAN PRO V80)

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    name: Build self-contained TAI APK
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Restore complete TITAN PRO V80 engine
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE="app/src/main/python/titan-v80-bundle.tar.xz.b64"
          test -s "$BUNDLE"
          base64 --decode "$BUNDLE" > /tmp/titan-v80.tar.xz
          tar -xJf /tmp/titan-v80.tar.xz -C app/src/main/python
          rm -f "$BUNDLE" /tmp/titan-v80.tar.xz
          test -f app/src/main/python/titan/runtime.py
          test -f app/src/main/python/titan/layers/core/bootstrap_storage.py
          # The upstream runtime resolves layer files relative to Chaquopy's
          # AssetFinder/app root. Keep both importable and legacy asset paths.
          mkdir -p app/src/main/python/app
          rm -rf app/src/main/python/app/titan
          cp -a app/src/main/python/titan app/src/main/python/app/titan
          test -f app/src/main/python/app/titan/layers/core/bootstrap_storage.py
          grep -q 'TITAN_FOLDER_NAME = "JJJ"' app/src/main/python/titan/layers/core/bootstrap_storage.py
          python3 -m compileall -q app/src/main/python/titan app/src/main/python/app/titan
          echo "Restored $(find app/src/main/python/titan -name '*.py' | wc -l) TITAN Python modules."
          echo "Legacy asset path verified: app/titan/layers/core/bootstrap_storage.py"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python for build checks
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd /tmp
          curl -fsSL -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses >/tmp/sdk-licenses.txt || true
          sdkmanager --sdk_root="$ANDROID_HOME" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "sdk.dir=$ANDROID_HOME" > "$GITHUB_WORKSPACE/local.properties"

      - name: Create TAI launcher icon
        shell: bash
        run: |
          mkdir -p app/src/main/res/mipmap-hdpi
          python3 - <<'PY'
          from pathlib import Path
          try:
              from PIL import Image, ImageDraw
              img = Image.new("RGBA", (192, 192), (2, 6, 23, 255))
              d = ImageDraw.Draw(img)
              d.ellipse((22, 22, 170, 170), fill=(14, 165, 233, 255))
              d.ellipse((48, 48, 144, 144), fill=(2, 6, 23, 255))
              d.line((58, 120, 84, 92, 102, 108, 139, 65), fill=(45, 212, 191, 255), width=9)
              img.save("app/src/main/res/mipmap-hdpi/ic_launcher.png")
          except Exception:
              Path("app/src/main/res/mipmap-hdpi/ic_launcher.png").write_bytes(bytes.fromhex(
                  "89504e470d0a1a0a0000000d49484452000000010000000108060000001f15c489"
                  "0000000a49444154789c63000100000500010d0a2db40000000049454e44ae426082"
              ))
          PY

      - name: Set up Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/gradle-8.7-bin.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          sudo unzip -qo /tmp/gradle-8.7-bin.zip -d /opt
          /opt/gradle-8.7/bin/gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      - name: Build APK with all native Python dependencies bundled
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify and name APK
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk TAI.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose TAI.apk
          APK_BYTES="$(stat -c '%s' TAI.apk)"
          echo "TAI.apk size: $APK_BYTES bytes"
          echo "APK_SIZE_BYTES=$APK_BYTES" >> "$GITHUB_STEP_SUMMARY"
          if [ "$APK_BYTES" -lt 41943040 ]; then
            echo "::error::TAI.apk is under the requested 40 MiB size threshold."
            exit 1
          fi
          sha256sum TAI.apk > TAI.apk.sha256
          echo "TITAN engine asset path checked; bundled runtime dependencies included." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload installable APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TAI-Android-APK
          path: |
            TAI.apk
            TAI.apk.sha256
          if-no-files-found: error
          retention-days: 30
