name: Build Titan V80 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    name: Build Android APK (Chaquopy)
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk

    steps:
      - uses: actions/checkout@v4

      - name: Verify titan sources
        run: |
          test -f app/src/main/python/android_main.py
          test -f app/src/main/python/titan/runtime.py
          find app/src/main/python/titan -name "*.py" | wc -l

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Android commandline tools + SDK
        run: |
          set -e
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd /tmp
          curl -fsSL -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses >/tmp/sdk-licenses.txt || true
          sdkmanager --sdk_root="$ANDROID_HOME" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "sdk.dir=$ANDROID_HOME" > "$GITHUB_WORKSPACE/local.properties"

      - name: Create default launcher icon
        run: |
          mkdir -p app/src/main/res/mipmap-hdpi
          python3 - <<'PY'
from pathlib import Path
try:
    from PIL import Image, ImageDraw
    img = Image.new("RGBA", (192, 192), (2, 6, 23, 255))
    d = ImageDraw.Draw(img)
    d.ellipse((30, 30, 162, 162), fill=(14, 165, 233, 255))
    d.ellipse((60, 60, 132, 132), fill=(2, 6, 23, 255))
    img.save("app/src/main/res/mipmap-hdpi/ic_launcher.png")
    print("icon ok")
except Exception as e:
    # minimal 1x1 fallback
    Path("app/src/main/res/mipmap-hdpi/ic_launcher.png").write_bytes(
        bytes.fromhex("89504e470d0a1a0a0000000d49484452000000010000000108060000001f15c4890000000a49444154789c63000100000500010d0a2db40000000049454e44ae426082")
    )
    print("fallback icon", e)
PY

      - name: Setup Gradle wrapper
        run: |
          curl -fsSL -o /tmp/gradle-8.7-bin.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          sudo unzip -qo /tmp/gradle-8.7-bin.zip -d /opt
          /opt/gradle-8.7/bin/gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      - name: Gradle assembleDebug
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Locate APK
        if: always()
        run: |
          find app/build/outputs -name "*.apk" -ls || true
          ls -lah app/build/outputs/apk/debug/ || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Titan-V80-Full-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14
